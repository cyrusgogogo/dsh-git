name: Release plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install locked development dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install isolated test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare release metadata
        id: package
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, mkdirSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.name !== 'dsh-git' || !/^\d+\.\d+\.\d+$/.test(pkg.version)) throw Error('Unexpected release package/version');
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${pkg.name}\nversion=${pkg.version}\n`);
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m).find(part => part.startsWith(`${pkg.version} `) || part.startsWith(`${pkg.version}\n`));
          if (!section) throw Error('Missing release notes for package version');
          mkdirSync('work', { recursive: true });
          writeFileSync('work/release-notes.md', `## ${section.trim()}\n\n验证范围：构建、154 项 Node 回归、39 项隔离浏览器回归与安装包内容核验。未安装进运行中的 DSH，未调用真实模型。\n`);
          NODE
      - name: Build and run Node and isolated browser regressions
        run: |
          export DSH_GIT_BROWSER="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          pnpm run check
      - name: Pack and verify installation archive
        run: |
          mkdir -p releases
          pnpm pack --pack-destination releases
          python3 <<'PYTHON'
          import hashlib, json, os, pathlib, tarfile
          pkg = json.loads(pathlib.Path('package.json').read_text())
          archive = pathlib.Path('releases') / f"{pkg['name']}-{pkg['version']}.tgz"
          with tarfile.open(archive, 'r:gz') as tar:
              files = {member.name: member for member in tar.getmembers()}
              required = ['package.json', 'dist/index.mjs', 'dist/client.js', 'cordis.patch.yml', 'README.md', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'docs/verification.md']
              for name in files:
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] == 'package', name
                  assert not files[name].issym() and not files[name].islnk(), name
              for name in required:
                  assert f'package/{name}' in files, name
              packed = json.load(tar.extractfile('package/package.json'))
              assert packed['name'] == pkg['name'] and packed['version'] == pkg['version']
              host = tar.extractfile('package/dist/index.mjs').read().decode()
              assert 'aiModels' in host and 'aiCommit' in host and 'commitAndPush' in host
          sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          pathlib.Path(str(archive)+'.sha256').write_text(f'{sha}  {archive.name}\n')
          report = {'name':pkg['name'], 'version':pkg['version'], 'artifact':archive.name, 'sha256':sha, 'sourceCommit':os.environ['GITHUB_SHA'], 'validation':{'build':True, 'nodeRegressions':True, 'isolatedBrowser':True, 'archiveContents':True, 'liveDshInstall':False, 'realModelRequest':False}}
          archive.with_suffix('.release.json').write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n')
          print(f'Verified {archive}: {sha}')
          PYTHON
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          archive="${PACKAGE_NAME}-${PACKAGE_VERSION}.tgz"
          tag="v${PACKAGE_VERSION}"
          gh release create "$tag" --draft --verify-tag --target "$GITHUB_SHA" \
            --title "${PACKAGE_NAME} ${PACKAGE_VERSION}" --notes-file work/release-notes.md \
            "releases/$archive" "releases/$archive.sha256" "releases/${PACKAGE_NAME}-${PACKAGE_VERSION}.release.json"
          mkdir -p work/published
          gh release download "$tag" --dir work/published
          (cd work/published && sha256sum --check "$archive.sha256")
          gh release edit "$tag" --draft=false --latest
          printf 'Published: %s/%s/releases/tag/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
